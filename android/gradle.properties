org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true

# Faster incremental builds (daemon / parallel / build cache).
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.incremental=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Tip for Android Studio Run/Debug: add env LXBOX_ABI_FILTER=arm64-v8a
# (or -PLXBOX_ABI_FILTER=arm64-v8a) — skips packaging unused ABIs from libbox.aar
# and roughly halves debug install size/time on a physical arm64 phone.
